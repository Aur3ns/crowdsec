name: Candidate smoke - CrowdSec AppSec
on:
  push:
    branches:
      - sync/crowdsec-2026-11-23-candidate
  workflow_dispatch:
permissions:
  contents: read
jobs:
  appsec-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: AppSec full package tests
        run: go test -count=1 ./pkg/appsec ./pkg/acquisition/modules/appsec
      - name: Shutdown regression tests under race detector
        run: go test -race -count=1 -v -run 'Test.*(Shutdown|Response)' ./pkg/appsec ./pkg/acquisition/modules/appsec
